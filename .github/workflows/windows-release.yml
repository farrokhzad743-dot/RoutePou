name: RoutePou Windows CI and Release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager
        run: python -m pip install --upgrade pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --paths windows --name RoutePou windows/routepou_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: RoutePou-Windows
          path: dist/RoutePou.exe
      - name: Publish Windows executable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RoutePou.exe

name: RoutePou Windows CI and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packager
        run: python -m pip install --upgrade pyinstaller pytest zxing-cpp pillow opencv-python

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: windows/wg-clinet/go.mod

      - name: Resolve and verify Go modules
        working-directory: windows/wg-clinet
        run: |
          go mod tidy
          go mod verify

      - name: Test WireGuard worker
        working-directory: windows/wg-clinet
        run: go test ./...

      - name: Build privileged WireGuard worker
        working-directory: windows/wg-clinet
        shell: pwsh
        run: go build -trimpath -ldflags="-s -w" -o ../relaywg-client.exe .

      - name: Download official Wintun runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile $env:RUNNER_TEMP\wintun.zip
          Expand-Archive -Path $env:RUNNER_TEMP\wintun.zip -DestinationPath $env:RUNNER_TEMP\wintun -Force
          Copy-Item $env:RUNNER_TEMP\wintun\amd64\wintun.dll windows\wintun.dll

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --paths windows --collect-all zxingcpp --collect-all PIL --collect-all cv2 --add-binary "windows/relaywg-client.exe;." --add-binary "windows/wintun.dll;." --name RoutePou windows/routepou_windows.py

      - uses: actions/upload-artifact@v4
        with:
          name: RoutePou-Windows
          path: dist/RoutePou.exe

      - name: Publish Windows executable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RoutePou.exe

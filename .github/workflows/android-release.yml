name: RoutePou Android CI and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'third_party/relay-wg/**'
      - 'scripts-build-wg-aar.sh'
      - 'shared/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'third_party/relay-wg/**'
      - 'scripts-build-wg-aar.sh'
      - 'shared/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: third_party/relay-wg/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build WireGuard Android AAR
        run: ./scripts-build-wg-aar.sh

      - name: Verify WireGuard AAR
        run: test -s android/app/libs/relaywg.aar

      - name: Assemble debug and release APKs
        working-directory: android
        run: gradle --no-daemon --stacktrace clean assembleDebug assembleRelease

      - name: Verify APK outputs
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh android/app/build/outputs/apk/{debug,release}/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoutePou-Android-0.26-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
